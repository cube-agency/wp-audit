name: CI and Docker image

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE_NAME: cubesystems/wp-audit

jobs:
  image:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint
        run: php -l wp-audit.php && php -l mu-plugin/cube-monitor.php

      - name: Test
        run: bash test/smoke.sh

      - name: Set image tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            version=latest
          else
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo 'Expected a version tag such as 1.0 or v1.0' >&2
              exit 1
            fi
          fi
          printf 'image=%s:%s\n' "$IMAGE_NAME" "$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}
          tags: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
